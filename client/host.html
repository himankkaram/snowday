<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Snow Day · Host</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <div class="host">
      <canvas id="game" aria-label="Game screen"></canvas>
      <aside class="side">
        <div class="row">
          <strong>Room <span id="room">----</span></strong>
          <span id="net" class="pill warn">connecting</span>
        </div>
        <img id="qr" class="qr" alt="QR code to join this room" />
        <p
          id="join-url"
          class="muted"
          style="font-size: 0.8rem; word-break: break-all; margin: 0"
        ></p>
        <div class="stack">
          <h2>Steering</h2>
          <select id="controller" aria-label="Steering device">
            <option value="keyboard">Keyboard only</option>
            <option value="mock">Mock board</option>
            <option value="serial">USB board</option>
          </select>
          <div class="row">
            <button id="connect-board">Connect board</button>
            <button id="recalibrate">Recalibrate</button>
          </div>
          <span id="ctrl-status" class="muted"></span>
        </div>
        <div class="stack">
          <h2>Round</h2>
          <div class="row">
            <button id="start" class="primary">Start (Space)</button>
            <button id="reset">Reset (R)</button>
          </div>
        </div>
        <div class="stack">
          <h2>Players <span id="count" class="muted">0</span></h2>
          <ul id="players"></ul>
        </div>
        <p class="muted" style="font-size: 0.8rem; margin-top: auto">
          D toggles debug overlay. Keyboard steering always works.
        </p>
      </aside>
    </div>
    <div id="debug" class="debug" hidden></div>
    <script type="module" src="/src/host/main.ts"></script>
  </body>
</html>
