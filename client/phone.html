<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0054e3" />
    <title>Snow Day · Player</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <main class="phone">
      <h1 class="wordart">Snow Day</h1>
      <div class="marquee" aria-hidden="true">
        <span>❄ flick ur phone 2 throw ❄ hit the rider ❄ snowball fight!!1! ❄</span>
      </div>

      <section class="win">
        <div class="win-title">
          <span>❄ Room <span id="room">----</span></span>
          <span id="net" class="pill warn">connecting</span>
        </div>
        <div class="win-body">
          <section id="join-view" class="stack">
            <label
              >Room code
              <input id="room-input" maxlength="4" autocapitalize="characters" autocomplete="off"
            /></label>
            <label
              >Your name <input id="name-input" maxlength="16" autocomplete="nickname"
            /></label>
            <button id="join-btn" class="primary">Join the fight!</button>
            <p id="join-error" class="feedback err" role="alert"></p>
          </section>

          <section id="play-view" class="stack" hidden>
            <p id="phase" class="phase">Waiting for the round to start</p>
            <label
              >Aim <input id="aim" type="range" min="-1" max="1" step="0.01" value="0"
            /></label>
            <button id="throw" class="throw-btn">❄ THROW! ❄</button>
            <p id="feedback" class="feedback" role="status" aria-live="polite"></p>
            <div class="row">
              <button id="motion-btn" class="primary">Use motion to throw</button>
              <button id="calibrate-btn" hidden>Calibrate aim</button>
            </div>
            <p id="motion-status" class="muted" style="font-size: 0.85rem; margin: 0"></p>
          </section>
        </div>
      </section>

      <div class="badges" aria-hidden="true">
        <span class="badge88 b1">Socket.IO<br />Powered</span>
        <span class="badge88 b2">ESP32<br />Inside</span>
        <span class="badge88 b3">Y2K<br />Compliant</span>
      </div>
    </main>
    <script type="module" src="/src/phone/main.ts"></script>
  </body>
</html>
